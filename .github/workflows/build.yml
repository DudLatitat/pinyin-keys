name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Make a full release with this version (e.g. 1.0.0). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write  # needed to create a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # No Gradle wrapper is committed; this action installs the pinned Gradle version.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Signed release build when the signing secrets exist, debug build otherwise.
      - name: Decode keystore
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build release APK (signed)
        if: steps.ks.outputs.path != ''
        env:
          SIGNING_KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk pinyin-keys.apk
          rm -f "$SIGNING_KEYSTORE_PATH"
      - name: Build debug APK
        if: steps.ks.outputs.path == ''
        run: |
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk pinyin-keys.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pinyin-keys
          path: pinyin-keys.apk
      # Every signed build on the branch or main is published as a full release named after
      # versionName (bump it in app/build.gradle.kts). An existing version is never overwritten.
      - name: Publish release
        if: steps.ks.outputs.path != '' && (github.ref_type == 'branch' || inputs.release_version != '')
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          VERSION="${INPUT_VERSION:-$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)}"
          # Remove the old rolling test prerelease if it's still there.
          gh release delete "build-${GITHUB_REF_NAME//\//-}" --yes --cleanup-tag 2>/dev/null || true
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already released; bump versionName to publish a new release."
            exit 0
          fi
          cp pinyin-keys.apk "pinyin-keys-$VERSION.apk"
          gh release create "v$VERSION" "pinyin-keys-$VERSION.apk" --latest \
            --target "$GITHUB_SHA" --title "Pinyin Keys $VERSION" --notes-file RELEASE_NOTES.md
